<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sitio en mantenimiento</title>
  <meta name="description" content="Estamos mejorando nuestro sistema. Muy pronto estaremos nuevamente disponibles." />

  <style>
    /* ======================================================================
       RESET Y VARIABLES GLOBALES
    ====================================================================== */
    :root {
      --bg-primary: #0b0f19;
      --bg-secondary: #131a2b;
      --accent: #6c8cff;
      --accent-soft: #8ea2ff;
      --text-primary: #f5f7ff;
      --text-secondary: #a9b2cc;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --success: #4ade80;
      --error: #f87171;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: var(--text-primary);
      background: radial-gradient(circle at 20% 20%, #17203a 0%, var(--bg-primary) 55%),
                  radial-gradient(circle at 80% 80%, #1c2440 0%, var(--bg-primary) 60%);
      background-color: var(--bg-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ======================================================================
       FONDO ANIMADO (particulas suaves / glow)
    ====================================================================== */
    .background-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.35;
      animation: float 12s ease-in-out infinite;
    }

    .glow-circle.one {
      width: 380px;
      height: 380px;
      background: #4d5bff;
      top: -100px;
      left: -80px;
      animation-delay: 0s;
    }

    .glow-circle.two {
      width: 300px;
      height: 300px;
      background: #9b6cff;
      bottom: -80px;
      right: -60px;
      animation-delay: 3s;
    }

    .glow-circle.three {
      width: 260px;
      height: 260px;
      background: #6cf0ff;
      bottom: 20%;
      left: 15%;
      animation-delay: 6s;
      opacity: 0.2;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0) scale(1); }
      50% { transform: translateY(-30px) translateX(20px) scale(1.08); }
    }

    /* ======================================================================
       CONTENEDOR PRINCIPAL
    ====================================================================== */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      margin: 24px;
      padding: 48px 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      animation: fadeInUp 0.9s ease both;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ======================================================================
       LOGO (opcional)
    ====================================================================== */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
      animation: fadeInUp 0.9s ease 0.1s both;
    }

    .logo-wrapper img {
      max-width: 96px;
      max-height: 96px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(108, 140, 255, 0.35));
    }

    /* Si no existe logo.png, este bloque se oculta automaticamente via JS */

    /* ======================================================================
       LOADER ANIMADO
    ====================================================================== */
    .loader {
      width: 56px;
      height: 56px;
      margin: 0 auto 32px auto;
      position: relative;
    }

    .loader span {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--accent);
      animation: spin 1.1s linear infinite;
    }

    .loader span:nth-child(2) {
      inset: 8px;
      border-top-color: var(--accent-soft);
      animation-duration: 1.6s;
      animation-direction: reverse;
      opacity: 0.7;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ======================================================================
       TEXTOS
    ====================================================================== */
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: linear-gradient(90deg, var(--text-primary), var(--accent-soft));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: fadeInUp 0.9s ease 0.15s both;
    }

    p.subtitle {
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 32px;
      animation: fadeInUp 0.9s ease 0.25s both;
    }

    /* ======================================================================
       BARRA DE PROGRESO DECORATIVA
    ====================================================================== */
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      margin-bottom: 36px;
      animation: fadeInUp 0.9s ease 0.35s both;
    }

    .progress-fill {
      height: 100%;
      width: 40%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      animation: progressMove 2.4s ease-in-out infinite;
    }

    @keyframes progressMove {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(60%); }
      100% { transform: translateX(220%); }
    }

    /* ======================================================================
       FORMULARIO DE CONTACTO (accion iniciada por el usuario)
    ====================================================================== */
    .contact-form {
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeInUp 0.9s ease 0.45s both;
    }

    .contact-form label {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: block;
    }

    .contact-form input,
    .contact-form textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.92rem;
      transition: border-color 0.2s ease, background 0.2s ease;
      resize: vertical;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.06);
    }

    .contact-form textarea {
      min-height: 90px;
    }

    .contact-form button {
      margin-top: 6px;
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent), var(--accent-soft));
      color: #0b0f19;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .contact-form button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px rgba(108, 140, 255, 0.35);
    }

    .contact-form button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .form-status {
      min-height: 20px;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .form-status.success {
      color: var(--success);
    }

    .form-status.error {
      color: var(--error);
    }

    .toggle-form-btn {
      margin-top: 10px;
      background: none;
      border: none;
      color: var(--accent-soft);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ======================================================================
       FOOTER
    ====================================================================== */
    footer {
      margin-top: 32px;
      font-size: 0.78rem;
      color: rgba(169, 178, 204, 0.6);
      animation: fadeInUp 0.9s ease 0.55s both;
    }

    /* ======================================================================
       RESPONSIVE
    ====================================================================== */
    @media (max-width: 480px) {
      .container {
        padding: 36px 24px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Fondo decorativo animado -->
  <div class="background-glow" aria-hidden="true">
    <div class="glow-circle one"></div>
    <div class="glow-circle two"></div>
    <div class="glow-circle three"></div>
  </div>

  <main class="container">

    <!-- Logo opcional: si /logo.png no existe, se oculta automaticamente -->
    <div class="logo-wrapper" id="logoWrapper">
      <img id="logoImg" src="/logo.png" alt="Logo" />
    </div>

    <!-- Loader animado -->
    <div class="loader" aria-hidden="true">
      <span></span>
      <span></span>
    </div>

    <h1>Estamos mejorando nuestro sistema.</h1>
    <p class="subtitle">Muy pronto estaremos nuevamente disponibles.</p>

    <div class="progress-track" aria-hidden="true">
      <div class="progress-fill"></div>
    </div>

    <!-- Formulario de contacto: accion explicita iniciada por el usuario -->
    <button type="button" class="toggle-form-btn" id="toggleFormBtn">
      ¿Necesitas contactarnos? Haz clic aqui
    </button>

    <form class="contact-form" id="contactForm" style="display: none;">
      <div>
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" placeholder="Tu nombre" required />
      </div>
      <div>
        <label for="email">Correo electronico</label>
        <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
      </div>
      <div>
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" placeholder="Escribe tu mensaje..." required></textarea>
      </div>
      <button type="submit" id="submitBtn">Enviar mensaje</button>
      <div class="form-status" id="formStatus" role="status"></div>
    </form>

    <footer>
      &copy; <span id="year"></span> Todos los derechos reservados.
    </footer>
  </main>

  <script>
    // ==========================================================================
    // JavaScript de la pagina de mantenimiento
    // ==========================================================================

    // Ano dinamico en el footer
    document.getElementById('year').textContent = new Date().getFullYear();

    // Oculta el logo automaticamente si la imagen no carga (logo opcional)
    const logoWrapper = document.getElementById('logoWrapper');
    const logoImg = document.getElementById('logoImg');
    logoImg.addEventListener('error', () => {
      logoWrapper.style.display = 'none';
    });

    // Mostrar/ocultar formulario de contacto
    const toggleFormBtn = document.getElementById('toggleFormBtn');
    const contactForm = document.getElementById('contactForm');

    toggleFormBtn.addEventListener('click', () => {
      const isHidden = contactForm.style.display === 'none';
      contactForm.style.display = isHidden ? 'flex' : 'none';
      toggleFormBtn.textContent = isHidden
        ? 'Ocultar formulario'
        : '¿Necesitas contactarnos? Haz clic aqui';
    });

    // Envio del formulario: accion explicita iniciada por el usuario
    const submitBtn = document.getElementById('submitBtn');
    const formStatus = document.getElementById('formStatus');

    contactForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();

      if (!name || !email || !message) {
        formStatus.textContent = 'Por favor completa todos los campos.';
        formStatus.className = 'form-status error';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Enviando...';
      formStatus.textContent = '';
      formStatus.className = 'form-status';

      try {
        const response = await fetch('/api/contact', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, message })
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          formStatus.textContent = '¡Mensaje enviado correctamente! Gracias por contactarnos.';
          formStatus.className = 'form-status success';
          contactForm.reset();
        } else {
          formStatus.textContent = data.error || 'Ocurrio un error al enviar el mensaje.';
          formStatus.className = 'form-status error';
        }
      } catch (error) {
        formStatus.textContent = 'Error de conexion. Intenta nuevamente mas tarde.';
        formStatus.className = 'form-status error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Enviar mensaje';
      }
    });
  </script>
</body>
</html>
